<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fırtına Lojistik - Veri Girişi</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      text-align: center;
      padding: 8px 0;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .form-card.active {
      display: flex;
    }
    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      display: block;
    }
    input, select, textarea {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    .btn-submit {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:active {
      transform: scale(0.98);
      background: #16a34a;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚛 FIRTINA LOJİSTİK</h1>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('nakliye')">Nakliye</button>
    <button class="tab-btn" onclick="switchTab('dikili')">Dikili</button>
    <button class="tab-btn" onclick="switchTab('veresiye')">Veresiye</button>
    <button class="tab-btn" onclick="switchTab('masraf')">Masraf</button>
  </div>

  <!-- 1. NAKLİYE FORMU -->
  <form id="form-nakliye" class="form-card active" onsubmit="gonder(event, 'nakliye_sefer')">
    <div>
      <label>Tarih</label>
      <input type="date" id="nak-tarih" required>
    </div>
    <div>
      <label>Plaka</label>
      <input type="text" id="nak-plaka" placeholder="Örn: 55 FRT 01" required>
    </div>
    <div>
      <label>Şoför</label>
      <input type="text" id="nak-sofor" placeholder="Şoför Adı" required>
    </div>
    <div>
      <label>Tonaj (Ton)</label>
      <input type="number" step="0.01" id="nak-tonaj" placeholder="0.00" required oninput="hesaplaNakliye()">
    </div>
    <div>
      <label>Birim Fiyat (TL/Ton)</label>
      <input type="number" step="0.01" id="nak-fiyat" placeholder="0.00" required oninput="hesaplaNakliye()">
    </div>
    <div>
      <label>Yakıt Gideri (TL)</label>
      <input type="number" step="0.01" id="nak-yakit" placeholder="0.00" oninput="hesaplaNakliye()">
    </div>
    <div>
      <label>Yükleme / Kantar (TL)</label>
      <input type="number" step="0.01" id="nak-yukleme" placeholder="0.00" oninput="hesaplaNakliye()">
    </div>
    <div>
      <label>Harcırah / Diğer (TL)</label>
      <input type="number" step="0.01" id="nak-harcirah" placeholder="0.00" oninput="hesaplaNakliye()">
    </div>
    <div>
      <label>Hesaplanan Net Kar (TL)</label>
      <input type="text" id="nak-net" readonly style="background:#1e293b; color:#4ade80; font-weight:bold;">
    </div>
    <button type="submit" class="btn-submit">💾 Kaydet ve Gönder</button>
  </form>

  <!-- 2. DİKİLİ SEFER FORMU -->
  <form id="form-dikili" class="form-card" onsubmit="gonder(event, 'dikili_sefer')">
    <div>
      <label>Tarih</label>
      <input type="date" id="dik-tarih" required>
    </div>
    <div>
      <label>Bölge / Orman İşletme</label>
      <input type="text" id="dik-bolge" placeholder="Örn: Vezirköprü" required>
    </div>
    <div>
      <label>İstif No / Parti</label>
      <input type="text" id="dik-istif" placeholder="Örn: 12/B">
    </div>
    <div>
      <label>Ağaç/Emval Türü</label>
      <input type="text" id="dik-tur" placeholder="Örn: Çam Tomruk" required>
    </div>
    <div>
      <label>Miktar / Tonaj</label>
      <input type="number" step="0.01" id="dik-tonaj" placeholder="0.00" required oninput="hesaplaDikili()">
    </div>
    <div>
      <label>Birim Fiyat (TL)</label>
      <input type="number" step="0.01" id="dik-fiyat" placeholder="0.00" required oninput="hesaplaDikili()">
    </div>
    <div>
      <label>Toplam Tutar (TL)</label>
      <input type="text" id="dik-tutar" readonly style="background:#1e293b; color:#4ade80; font-weight:bold;">
    </div>
    <div>
      <label>Taşıyan Plaka</label>
      <input type="text" id="dik-plaka" placeholder="Araç Plakası">
    </div>
    <button type="submit" class="btn-submit">💾 Kaydet ve Gönder</button>
  </form>

  <!-- 3. VERESİYE FORMU -->
  <form id="form-veresiye" class="form-card" onsubmit="gonder(event, 'dikili_veresiye')">
    <div>
      <label>Tarih</label>
      <input type="date" id="ver-tarih" required>
    </div>
    <div>
      <label>Müşteri / Cari Adı</label>
      <input type="text" id="ver-musteri" placeholder="Müşteri Ad Soyad" required>
    </div>
    <div>
      <label>İşlem Türü</label>
      <select id="ver-tur">
        <option value="Veresiye Satış">Veresiye Satış (Borçlandır)</option>
        <option value="Tahsilat">Tahsilat (Ödeme Aldım)</option>
      </select>
    </div>
    <div>
      <label>İşlem Tutarı (TL)</label>
      <input type="number" step="0.01" id="ver-tutar" placeholder="0.00" required>
    </div>
    <div>
      <label>Açıklama</label>
      <input type="text" id="ver-aciklama" placeholder="Not veya detay...">
    </div>
    <button type="submit" class="btn-submit">💾 Kaydet ve Gönder</button>
  </form>

  <!-- 4. MASRAF FORMU -->
  <form id="form-masraf" class="form-card" onsubmit="gonder(event, 'masraf')">
    <div>
      <label>Tarih</label>
      <input type="date" id="mas-tarih" required>
    </div>
    <div>
      <label>Kategori</label>
      <select id="mas-kategori">
        <option value="Tamir / Bakım">Tamir / Bakım</option>
        <option value="Lastik">Lastik</option>
        <option value="Sigorta / Kasko">Sigorta / Kasko</option>
        <option value="Yemek / Harcırah">Yemek / Harcırah</option>
        <option value="Genel Gider">Genel Gider</option>
      </select>
    </div>
    <div>
      <label>Tutar (TL)</label>
      <input type="number" step="0.01" id="mas-tutar" placeholder="0.00" required>
    </div>
    <div>
      <label>Açıklama / Fiş No</label>
      <input type="text" id="mas-aciklama" placeholder="Detay yazın...">
    </div>
    <button type="submit" class="btn-submit">💾 Kaydet ve Gönder</button>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Bugünün tarihini varsayılan olarak ata
    const today = new Date().toISOString().split('T')[0];
    document.querySelectorAll('input[type="date"]').forEach(el => el.value = today);

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.form-card').forEach(card => card.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('form-' + tab).classList.add('active');
    }

    function hesaplaNakliye() {
      const tonaj = parseFloat(document.getElementById('nak-tonaj').value) || 0;
      const fiyat = parseFloat(document.getElementById('nak-fiyat').value) || 0;
      const yakit = parseFloat(document.getElementById('nak-yakit').value) || 0;
      const yukleme = parseFloat(document.getElementById('nak-yukleme').value) || 0;
      const harcirah = parseFloat(document.getElementById('nak-harcirah').value) || 0;
      
      const toplamGelir = tonaj * fiyat;
      const toplamGider = yakit + yukleme + harcirah;
      document.getElementById('nak-net').value = (toplamGelir - toplamGider).toFixed(2);
    }

    function hesaplaDikili() {
      const tonaj = parseFloat(document.getElementById('dik-tonaj').value) || 0;
      const fiyat = parseFloat(document.getElementById('dik-fiyat').value) || 0;
      document.getElementById('dik-tutar').value = (tonaj * fiyat).toFixed(2);
    }

    function gonder(e, modul) {
      e.preventDefault();
      let payload = { modul: modul };

      if (modul === 'nakliye_sefer') {
        payload.tarih = document.getElementById('nak-tarih').value;
        payload.plaka = document.getElementById('nak-plaka').value;
        payload.sofor = document.getElementById('nak-sofor').value;
        payload.tonaj = document.getElementById('nak-tonaj').value;
        payload.fiyat = document.getElementById('nak-fiyat').value;
        payload.yakit = document.getElementById('nak-yakit').value || "0";
        payload.yukleme = document.getElementById('nak-yukleme').value || "0";
        payload.harcirah = document.getElementById('nak-harcirah').value || "0";
        payload.net = document.getElementById('nak-net').value;
      } else if (modul === 'dikili_sefer') {
        payload.tarih = document.getElementById('dik-tarih').value;
        payload.bolge = document.getElementById('dik-bolge').value;
        payload.istif = document.getElementById('dik-istif').value || "-";
        payload.tur = document.getElementById('dik-tur').value;
        payload.tonaj = document.getElementById('dik-tonaj').value;
        payload.fiyat = document.getElementById('dik-fiyat').value;
        payload.tutar = document.getElementById('dik-tutar').value;
        payload.plaka = document.getElementById('dik-plaka').value || "-";
      } else if (modul === 'dikili_veresiye') {
        payload.tarih = document.getElementById('ver-tarih').value;
        payload.musteri = document.getElementById('ver-musteri').value;
        payload.islem_turu = document.getElementById('ver-tur').value;
        payload.tutar = document.getElementById('ver-tutar').value;
        payload.aciklama = document.getElementById('ver-aciklama').value || "-";
      } else if (modul === 'masraf') {
        payload.tarih = document.getElementById('mas-tarih').value;
        payload.kategori = document.getElementById('mas-kategori').value;
        payload.tutar = document.getElementById('mas-tutar').value;
        payload.aciklama = document.getElementById('mas-aciklama').value || "-";
      }

      if (tg) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert("Telegram WebApp başlatılamadı!");
      }
    }
  </script>
</body>
</html>
